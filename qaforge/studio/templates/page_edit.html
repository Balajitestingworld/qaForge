{% extends "base.html" %}
{% block title %}Edit {{ page.title }}{% endblock %}
{% block main %}
<div class="head"><div><h1>Edit {{ page.title }}</h1>
<p class="lede">Changes rewrite the Studio-owned page-object file <span class="mono">apps/{{ page.app }}/pages/</span>. Every locator is checked before it is written.</p></div></div>
<div id="page-editor" data-url="{{ url_for('api_page_save', ref=ref) }}">
  <div class="sheet">
    <div class="row">
      <div><label class="f" for="pe-title">Page name</label><input type="text" id="pe-title" value="{{ page.title }}"></div>
      <div><label class="f" for="pe-path">Address</label><input type="text" id="pe-path" value="{{ page.path or '' }}" placeholder="/payments/new"></div>
      <div><label class="f" for="pe-anchor">Page is ready when this is shown</label><select id="pe-anchor"></select></div>
    </div>
  </div>
  <h2>Elements</h2>
  <table class="grid" id="pe-rows"></table>
  <div class="sticky"><div class="btns"><button class="btn" id="pe-add" type="button">Add element</button><span style="flex:1"></span>
    <span id="pe-msg" role="status"></span><a class="btn quiet" href="{{ url_for('page_detail', ref=ref) }}">Cancel</a><button class="btn primary" id="pe-save" type="button">Save page object</button></div></div>
</div>
<script type="application/json" id="page-data">{{ page|tojson }}</script>
{% endblock %}
